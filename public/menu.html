<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنيو | أوزو OZO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <header class="m-head">
    <img class="m-logo" src="logo.jpeg" alt="أوزو OZO">
    <h1 id="m-store">أوزو OZO</h1>
    <div class="m-sub" id="m-sub">أهلاً بكم</div>
  </header>

  <div class="m-tools">
    <input class="m-search" id="m-search" type="search" placeholder="🔍 ابحث في المنيو...">
  </div>

  <nav class="m-chips" id="m-chips"></nav>

  <main class="m-main" id="m-main">
    <div class="m-loading">...جارٍ تحميل المنيو</div>
  </main>

  <footer class="m-foot" id="m-foot">
    <div id="m-phone"></div>
    <div id="m-address"></div>
  </footer>

  <section class="m-share">
    <div class="m-share-title">شارك المنيو</div>
    <img class="m-qr" id="m-qr" alt="باركود المنيو">
    <div class="m-share-hint">امسح الكود بكاميرا الموبايل لفتح المنيو</div>
  </section>

  <div class="wa-bar" id="wa-bar">
    <div id="wa-cart"></div>
    <button class="wa-btn" id="wa-btn" type="button" disabled>أرسل الطلب عبر واتساب</button>
  </div>

  <script type="module" src="menu.js"></script>
</body>
</html>
